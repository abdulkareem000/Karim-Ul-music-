<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c12"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with Safe Margin -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="496" height="496" x="8" y="8" rx="104" fill="none" stroke="#10b981" stroke-opacity="0.25" stroke-width="4"/>

  <!-- Glowing Orb Behind Logo -->
  <circle cx="256" cy="256" r="140" fill="#10b981" fill-opacity="0.12" filter="url(#glow)"/>

  <!-- Modern Music / Karim Ul Audio Crest -->
  <g transform="translate(106, 106) scale(0.5859375)">
    <!-- Equalizer Waves -->
    <rect x="40" y="240" width="40" height="120" rx="20" fill="url(#accentGrad)" opacity="0.8"/>
    <rect x="110" y="160" width="40" height="200" rx="20" fill="url(#accentGrad)" opacity="0.9"/>
    <rect x="180" y="80" width="40" height="280" rx="20" fill="url(#accentGrad)"/>
    <rect x="250" y="120" width="40" height="240" rx="20" fill="url(#accentGrad)"/>
    <rect x="320" y="190" width="40" height="170" rx="20" fill="url(#accentGrad)" opacity="0.9"/>
    <rect x="390" y="250" width="40" height="110" rx="20" fill="url(#accentGrad)" opacity="0.8"/>
    
    <!-- Headphones Arc -->
    <path d="M 60 250 A 196 196 0 0 1 452 250" fill="none" stroke="url(#accentGrad)" stroke-width="36" stroke-linecap="round"/>
  </g>

  <!-- Subtitle Text inside Safe Zone -->
  <text x="256" y="445" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="3">
    KARIM <tspan fill="#34d399">UL</tspan>
  </text>
</svg>
